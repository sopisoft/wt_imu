[workspace]
name = "wt_imu"
channels = ["robostack-jazzy", "conda-forge"]
platforms = ["linux-64"]

[activation.env]
AMENT_PREFIX_PATH = "$PWD/install/wt_imu:$CONDA_PREFIX"
CMAKE_PREFIX_PATH = "$PWD/install/wt_imu:$CONDA_PREFIX:$CMAKE_PREFIX_PATH"
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib:/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH"
LIBRARY_PATH = "$CONDA_PREFIX/lib"
RMW_IMPLEMENTATION = "rmw_fastrtps_cpp"

[dependencies]
python = ">=3.12,<3.13"
ros-jazzy-desktop = ">=0.11.0,<0.12"
ros-jazzy-ament-lint-auto = ">=0.17.5,<1"
ros-jazzy-ament-lint-common = ">=0.17.5,<1"
colcon-common-extensions = ">=0.3.0,<0.4"
cmake = ">=4.4.0,<5"
ninja = ">=1.13.2,<2"
cxx-compiler = ">=2.0.0,<3"
clang-format = ">=22.1.8,<24"
gtest = ">=1.17.0,<2"

[tasks]
build = "colcon build --symlink-install --base-paths . --packages-select wt_imu"
test = { cmd = "ctest --test-dir build/wt_imu --output-on-failure -L gtest", depends-on = ["build"] }
lint = { cmd = "ctest --test-dir build/wt_imu --output-on-failure -L linter", depends-on = ["build"] }
format = "find include src test -type f \\( -name '*.cpp' -o -name '*.hpp' \\) -print0 | xargs -0 clang-format -i"
format-check = "find include src test -type f \\( -name '*.cpp' -o -name '*.hpp' \\) -print0 | xargs -0 clang-format --dry-run --Werror"
clean = "rm -rf build install log"
launch = { cmd = "ros2 launch wt_imu wt_imu.launch.xml", depends-on = ["build"] }
rqt = "rqt"
rviz = "rviz2"
check = [{ task = "test" }, { task = "lint" }, { task = "format-check" }]
